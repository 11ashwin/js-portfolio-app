# EXAMPLE ONLY — do not fill in real values here and do not apply this file
# directly. Secrets committed to Git (even in a "private" repo) tend to leak
# eventually. Create the real Secret imperatively instead:
#
#   kubectl create secret generic portfolio-backend-secret \
#     --from-literal=PGUSER=portfolio_app \
#     --from-literal=PGPASSWORD='<strong-password>' \
#     --from-literal=JWT_SECRET="$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")" \
#     -n portfolio
#
# Or, better for GitOps (matches the Argo CD setup in your other project):
# use Sealed Secrets or SOPS so an *encrypted* version can safely live in Git.

apiVersion: v1
kind: Secret
metadata:
  name: portfolio-backend-secret
  labels:
    app: portfolio-backend
type: Opaque
stringData:
  PGUSER: "portfolio_app"
  PGPASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_WITH_A_LONG_RANDOM_STRING"
