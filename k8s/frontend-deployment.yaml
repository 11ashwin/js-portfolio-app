apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: portfolio-frontend

  template:
    metadata:
      labels:
        app: portfolio-frontend

    spec:
      containers:
        - name: frontend

          image: a05shwin11/portfolio-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-frontend

spec:
  type: NodePort

  selector:
    app: portfolio-frontend

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
