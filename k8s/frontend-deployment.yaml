apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend
  labels:
    app: portfolio-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-frontend
  template:
    metadata:
      labels:
        app: portfolio-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx-unprivileged image's built-in "nginx" user
      containers:
        - name: portfolio-frontend
          image: YOUR_REGISTRY/portfolio-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          volumeMounts:
            # nginx needs a few writable paths even when just serving static
            # files (cache, pid, temp dirs) — emptyDirs keep the root FS
            # read-only without a hostPath mount.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-frontend
  labels:
    app: portfolio-frontend
spec:
  type: ClusterIP
  selector:
    app: portfolio-frontend
  ports:
    - port: 8080
      targetPort: 8080
