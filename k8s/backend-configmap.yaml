apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-backend-config
  labels:
    app: portfolio-backend
data:
  PORT: "3001"
  NODE_ENV: "production"
  # Update this to wherever the frontend is actually served from in-cluster
  # (e.g. your Ingress host) — the API rejects browser requests from any
  # other origin.
  CORS_ORIGIN: "https://portfolio.example.com"
  PGHOST: "postgres.portfolio.svc.cluster.local"
  PGPORT: "5432"
  PGDATABASE: "portfolio"
  JWT_EXPIRES_IN: "8h"
  INQUIRY_RATE_LIMIT_WINDOW_MS: "3600000"
  INQUIRY_RATE_LIMIT_MAX: "5"
