# EXAMPLE ONLY — see backend-secret.example.yaml for the same caveat.
# Create imperatively instead:
#
#   kubectl create secret generic portfolio-postgres-secret \
#     --from-literal=POSTGRES_USER=portfolio_app \
#     --from-literal=POSTGRES_PASSWORD='<strong-password>' \
#     --from-literal=POSTGRES_DB=portfolio \
#     -n portfolio
#
# Use the SAME password here as PGPASSWORD in backend-secret, since the
# backend authenticates to Postgres with these credentials.

apiVersion: v1
kind: Secret
metadata:
  name: portfolio-postgres-secret
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "portfolio_app"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "portfolio"
