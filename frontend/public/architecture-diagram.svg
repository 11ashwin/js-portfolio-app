<?xml version="1.0" encoding="UTF-8"?>
      <svg width="100%" viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <style>
          .ab{fill:#161b22;stroke:rgba(255,255,255,0.1);stroke-width:.5}
          .ab-blue{fill:#0d1f33;stroke:#58a6ff;stroke-width:.8}
          .ab-teal{fill:#0d1f18;stroke:#3fb950;stroke-width:.8}
          .ab-amber{fill:#1f1500;stroke:#d29922;stroke-width:.8}
          .ab-red{fill:#1f0e0d;stroke:#f85149;stroke-width:.8}
          .ab-purple{fill:#130e20;stroke:#a371f7;stroke-width:.8}
          .ab-green{fill:#0b1a0e;stroke:#3fb950;stroke-width:.8}
          .at{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;fill:#cdd9e5}
          .ats{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#768390}
          .af{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#444c56}
          .al{fill:none;stroke-width:1.2}
          .ad{fill:none;stroke-width:1;stroke-dasharray:4 3;stroke:rgba(88,166,255,.4)}
        </style>

        <text class="af" x="20" y="70" text-anchor="middle" transform="rotate(-90,20,70)">Source</text>
        <text class="af" x="20" y="220" text-anchor="middle" transform="rotate(-90,20,220)">CI / Supply chain</text>
        <text class="af" x="20" y="370" text-anchor="middle" transform="rotate(-90,20,370)">Registry</text>
        <text class="af" x="20" y="456" text-anchor="middle" transform="rotate(-90,20,456)">GitOps</text>
        <text class="af" x="20" y="526" text-anchor="middle" transform="rotate(-90,20,526)">Policy</text>
        <text class="af" x="20" y="680" text-anchor="middle" transform="rotate(-90,20,680)">Runtime</text>

        <!-- Source -->
        <rect class="ab" x="50" y="42" width="130" height="52" rx="8"/>
        <text class="at" x="115" y="62" text-anchor="middle">Developer</text>
        <text class="ats" x="115" y="80" text-anchor="middle">git push</text>
        <line x1="180" y1="68" x2="258" y2="68" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>
        <rect class="ab-blue" x="260" y="42" width="180" height="52" rx="8"/>
        <text class="at" x="350" y="62" text-anchor="middle">GitHub Repository</text>
        <text class="ats" x="350" y="80" text-anchor="middle">source + manifests</text>
        <line x1="350" y1="94" x2="350" y2="130" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <!-- CI / supply chain box -->
        <rect x="44" y="132" width="1500" height="190" rx="10" fill="none" stroke="rgba(88,166,255,.14)" stroke-width="1" stroke-dasharray="5 4"/>
        <text class="af" x="58" y="150">GitHub Actions CI/CD — SAST · SCA · DAST · Supply Chain Security</text>

        <rect class="ab-amber" x="56" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="125" y="176" text-anchor="middle">Secret scan</text>
        <text class="ats" x="125" y="191" text-anchor="middle">Gitleaks · planned</text>
        <line x1="194" y1="180" x2="204" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-amber" x="204" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="273" y="176" text-anchor="middle">Semgrep</text>
        <text class="ats" x="273" y="191" text-anchor="middle">SAST · source code</text>
        <line x1="342" y1="180" x2="352" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-amber" x="352" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="421" y="176" text-anchor="middle">Trivy FS scan</text>
        <text class="ats" x="421" y="191" text-anchor="middle">repo scan</text>
        <line x1="490" y1="180" x2="500" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-amber" x="500" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="569" y="176" text-anchor="middle">Socket.dev</text>
        <text class="ats" x="569" y="191" text-anchor="middle">SCA · exploring</text>
        <line x1="638" y1="180" x2="648" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-blue" x="648" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="717" y="176" text-anchor="middle">Docker build</text>
        <text class="ats" x="717" y="191" text-anchor="middle">ARM64 + AMD64</text>
        <line x1="786" y1="180" x2="796" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-amber" x="796" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="865" y="176" text-anchor="middle">Trivy image scan</text>
        <text class="ats" x="865" y="191" text-anchor="middle">block HIGH/CRIT</text>
        <line x1="934" y1="180" x2="944" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-amber" x="944" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="1013" y="176" text-anchor="middle">OWASP ZAP</text>
        <text class="ats" x="1013" y="191" text-anchor="middle">DAST · 57 pass/10 warn</text>
        <line x1="1082" y1="180" x2="1092" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-teal" x="1092" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="1161" y="176" text-anchor="middle">Generate SBOM</text>
        <text class="ats" x="1161" y="191" text-anchor="middle">Syft · CycloneDX</text>
        <line x1="1230" y1="180" x2="1240" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-purple" x="1240" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="1309" y="176" text-anchor="middle">Cosign sign</text>
        <text class="ats" x="1309" y="191" text-anchor="middle">image signing</text>
        <line x1="1378" y1="180" x2="1388" y2="180" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>

        <rect class="ab-purple" x="1388" y="158" width="138" height="44" rx="6"/>
        <text class="at" x="1457" y="176" text-anchor="middle">Verify</text>
        <text class="ats" x="1457" y="191" text-anchor="middle">signature</text>

        <path d="M1457 202 L 1457 213 L 995 213 L 995 220" class="al" stroke="#3fb950" marker-end="url(#arr)" fill="none"/>
        <rect class="ab" x="910" y="222" width="170" height="44" rx="6"/>
        <text class="at" x="995" y="240" text-anchor="middle">Push to registry</text>
        <text class="ats" x="995" y="255" text-anchor="middle">versioned tag</text>
        <line x1="910" y1="244" x2="870" y2="244" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>
        <rect class="ab" x="700" y="222" width="170" height="44" rx="6"/>
        <text class="at" x="785" y="240" text-anchor="middle">Update manifest</text>
        <text class="ats" x="785" y="255" text-anchor="middle">deployment.yaml</text>
        <path d="M700 244 L 350 244 L 350 132" class="ad" marker-end="url(#arr)"/>
        <text class="ats" x="400" y="240">commit back to Git</text>

        <!-- Registry -->
        <line x1="995" y1="266" x2="995" y2="342" class="al" stroke="#3fb950" marker-end="url(#arr)"/>
        <rect class="ab-teal" x="880" y="344" width="230" height="52" rx="8"/>
        <text class="at" x="995" y="364" text-anchor="middle">Docker Hub</text>
        <text class="ats" x="995" y="382" text-anchor="middle">cosign-verified images only</text>

        <!-- GitOps -->
        <path d="M350 322 L 350 430 L 685 430" class="ad" marker-end="url(#arr)"/>
        <text class="ats" x="375" y="424">watches Git</text>
        <line x1="995" y1="396" x2="995" y2="430" class="al" stroke="#3fb950" marker-end="url(#arr)"/>
        <rect class="ab-purple" x="685" y="430" width="200" height="52" rx="8"/>
        <text class="at" x="785" y="450" text-anchor="middle">Argo CD</text>
        <text class="ats" x="785" y="468" text-anchor="middle">sync from Git</text>
        <rect class="ab-purple" x="895" y="430" width="200" height="52" rx="8"/>
        <text class="at" x="995" y="450" text-anchor="middle">Argo CD</text>
        <text class="ats" x="995" y="468" text-anchor="middle">pull image + deploy</text>
        <line x1="785" y1="482" x2="785" y2="498" class="al" stroke="#a371f7" marker-end="url(#arr)"/>
        <line x1="995" y1="482" x2="995" y2="498" class="al" stroke="#a371f7" marker-end="url(#arr)"/>

        <!-- Policy gate -->
        <rect class="ab-red" x="540" y="500" width="700" height="52" rx="8"/>
        <text class="at" x="890" y="520" text-anchor="middle">Kyverno admission control</text>
        <text class="ats" x="890" y="538" text-anchor="middle">blocks :latest tag · blocks hostPath mounts</text>
        <path d="M890 552 L 890 582 L 126 582 L 126 596" class="al" stroke="#f85149" marker-end="url(#arr)" fill="none"/>

        <!-- Kubernetes cluster -->
        <rect x="44" y="570" width="1500" height="150" rx="12" fill="none" stroke="rgba(63,185,80,.2)" stroke-width="1" stroke-dasharray="5 4"/>
        <text class="af" x="58" y="588">Kubernetes (Minikube)</text>

        <rect class="ab-teal"   x="56"   y="596" width="140" height="44" rx="6"/>
        <text class="at"  x="126"  y="614" text-anchor="middle">Resume app</text>
        <text class="ats" x="126"  y="629" text-anchor="middle">NGINX + Ingress</text>

        <rect class="ab-red"    x="247"  y="596" width="140" height="44" rx="6"/>
        <text class="at"  x="317"  y="614" text-anchor="middle">Falco</text>
        <text class="ats" x="317"  y="629" text-anchor="middle">runtime detection</text>

        <rect class="ab-amber"  x="438"  y="596" width="140" height="44" rx="6"/>
        <text class="at"  x="508"  y="614" text-anchor="middle">Falcosidekick</text>
        <text class="ats" x="508"  y="629" text-anchor="middle">alert routing</text>

        <rect class="ab-teal"   x="629"  y="596" width="140" height="44" rx="6"/>
        <text class="at"  x="699"  y="614" text-anchor="middle">Loki</text>
        <text class="ats" x="699"  y="629" text-anchor="middle">log aggregation</text>

        <rect class="ab-blue"   x="820"  y="596" width="140" height="44" rx="6"/>
        <text class="at"  x="890"  y="614" text-anchor="middle">Trivy Operator</text>
        <text class="ats" x="890"  y="629" text-anchor="middle">config ✓ · vuln pending</text>

        <rect class="ab-blue"   x="1011" y="596" width="140" height="44" rx="6"/>
        <text class="at"  x="1081" y="614" text-anchor="middle">Prometheus</text>
        <text class="ats" x="1081" y="629" text-anchor="middle">metrics</text>

        <rect class="ab-green"  x="1202" y="596" width="140" height="44" rx="6"/>
        <text class="at"  x="1272" y="614" text-anchor="middle">Grafana</text>
        <text class="ats" x="1272" y="629" text-anchor="middle">dashboard</text>

        <rect class="ab"        x="1393" y="596" width="140" height="44" rx="6"/>
        <text class="at"  x="1463" y="614" text-anchor="middle">Kite</text>
        <text class="ats" x="1463" y="629" text-anchor="middle">cluster UI</text>

        <line x1="196"  y1="618" x2="247"  y2="618" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>
        <line x1="387"  y1="618" x2="438"  y2="618" class="al" stroke="#f85149" marker-end="url(#arr)"/>
        <line x1="578"  y1="618" x2="629"  y2="618" class="al" stroke="#d29922" marker-end="url(#arr)"/>
        <line x1="769"  y1="618" x2="820"  y2="618" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>
        <line x1="960"  y1="618" x2="1011" y2="618" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>
        <line x1="1151" y1="618" x2="1202" y2="618" class="al" stroke="#58a6ff" marker-end="url(#arr)"/>
        <line x1="1342" y1="618" x2="1393" y2="618" class="al" stroke="#3fb950" marker-end="url(#arr)"/>
      </svg>
