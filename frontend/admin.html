<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Admin | Hiring Inquiries</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#07090d;--surface:#0c0f15;--surface-2:#12161f;--surface-3:#181d29;
    --border:rgba(255,255,255,0.07);--border-hover:rgba(255,255,255,0.14);--border-accent:rgba(88,166,255,0.35);
    --text:#dbe4ee;--muted:#828fa0;--faint:#4b5567;
    --accent:#58a6ff;--accent-dim:rgba(88,166,255,0.1);
    --accent-2:#2dd7ac;--accent-2-dim:rgba(45,215,172,0.1);
    --success:#3fb950;--success-dim:rgba(63,185,80,0.1);
    --warning:#d29922;--warning-dim:rgba(210,153,34,.1);
    --danger:#f85149;--danger-dim:rgba(248,81,73,.1);
    --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;--display:'Space Grotesk',var(--sans);
    --r-sm:6px;--r-md:10px;--r-lg:16px;
    --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-lift:0 16px 36px -14px rgba(0,0,0,.55);
  }
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
  body::after{content:'';position:fixed;top:-18%;left:50%;width:900px;height:560px;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(88,166,255,.09) 0%,rgba(45,215,172,.045) 40%,transparent 72%);
    pointer-events:none;z-index:0;filter:blur(10px)}
  a{color:var(--accent)}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:48px 28px 120px}
  .sec-label{font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin-bottom:14px}

  /* ── login screen ── */
  #login-view{max-width:380px;margin:120px auto 0}
  #login-view h1{font-family:var(--display);font-size:22px;font-weight:700;color:#eef3f8;margin-bottom:8px;letter-spacing:-.3px}
  #login-view p{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
  .field label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
  .field input{font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;transition:border-color .15s}
  .field input:focus{outline:none;border-color:var(--accent)}
  .btn{font-family:var(--mono);font-size:12px;font-weight:500;color:#04101f;background:linear-gradient(100deg,var(--accent),var(--accent-2));border:none;border-radius:var(--r-sm);padding:12px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:filter .15s,transform .15s;box-shadow:0 6px 20px -8px rgba(88,166,255,.5)}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:wait;transform:none}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);box-shadow:none}
  .btn-ghost:hover{color:var(--text);border-color:var(--border-hover);filter:none;transform:none}
  .login-err{font-family:var(--mono);font-size:12px;color:var(--danger);background:var(--danger-dim);border:1px solid rgba(248,81,73,.25);border-radius:var(--r-sm);padding:11px 13px;margin-top:16px;display:none}
  .login-err.show{display:block}

  /* ── dashboard ── */
  #dash-view{display:none}
  #dash-view.show{display:block}
  .dash-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
  .dash-top h1{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.6px;margin-bottom:8px;
    background:linear-gradient(100deg,#f2f6fa 30%,var(--accent) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .dash-top .who{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  .counts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:28px;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:5px;width:fit-content;max-width:100%}
  .count-pill{font-family:var(--mono);font-size:11.5px;padding:8px 16px;border-radius:100px;border:none;color:var(--muted);cursor:pointer;background:none;transition:background .18s,color .18s;font-weight:500;white-space:nowrap}
  .count-pill.active{color:#04101f;background:linear-gradient(100deg,var(--accent),var(--accent-2));font-weight:600}
  .count-pill b{color:inherit}

  /* ── inquiry cards ── */
  .inq-list{display:flex;flex-direction:column;gap:12px}
  .inq-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px;transition:border-color .2s,transform .2s,box-shadow .2s;box-shadow:var(--shadow-card)}
  .inq-card:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift)}
  .inq-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .inq-who{display:flex;align-items:center;gap:14px}
  .inq-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent-dim),var(--accent-2-dim));
    border:1px solid var(--border-accent);color:var(--accent-2);display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:15px;flex-shrink:0}
  .inq-name{font-family:var(--display);font-size:15.5px;font-weight:600;color:#eef3f8;letter-spacing:-.1px}
  .inq-company{font-size:12.5px;color:var(--muted);margin-top:1px}
  .inq-company a{color:var(--muted);transition:color .15s}
  .inq-company a:hover{color:var(--accent)}
  .inq-meta-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .inq-date{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}

  .inq-body{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:24px}
  .inq-block-label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:8px}
  .inq-role{font-size:13.5px;color:var(--text);font-weight:600;margin-bottom:5px}
  .inq-sub{font-size:12.5px;color:var(--muted);line-height:1.7}
  .inq-desc{font-size:12.5px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
  .inq-extra{margin-top:10px;display:flex;flex-direction:column;gap:5px;font-size:12px}
  .inq-extra a{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-family:var(--mono);font-size:10px;color:var(--accent-2);background:var(--accent-2-dim);border:1px solid rgba(45,215,172,.22);padding:4px 9px;border-radius:100px;white-space:nowrap}

  .inq-actions{display:flex;align-items:center;gap:8px}
  .status-select{font-family:var(--mono);font-size:11px;background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;transition:border-color .15s}
  .status-select:focus{outline:none;border-color:var(--accent)}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:var(--r-sm);padding:7px 11px;cursor:pointer;font-family:var(--mono);font-size:11px;transition:color .15s,border-color .15s}
  .icon-btn:hover{color:var(--danger);border-color:rgba(248,81,73,.3);background:var(--danger-dim)}

  .empty-state{text-align:center;padding:80px 20px;color:var(--muted);font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg)}
  .loading{text-align:center;padding:80px 20px;color:var(--faint);font-family:var(--mono);font-size:12px}

  @media(max-width:820px){
    .inq-body{grid-template-columns:1fr;gap:16px}
    .inq-top{align-items:flex-start}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login-view">
    <h1>Admin access</h1>
    <p>Hiring inquiries dashboard — sign in with your admin credentials.</p>
    <form id="login-form">
      <div class="field">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" required autocomplete="username"/>
      </div>
      <div class="field">
        <label for="l-password">Password</label>
        <input type="password" id="l-password" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn" id="login-btn">Sign in</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dash-view">
    <div class="dash-top">
      <div>
        <h1>Hiring inquiries</h1>
        <div class="who" id="who"></div>
      </div>
      <button class="btn btn-ghost" id="logout-btn">Sign out</button>
    </div>

    <div class="counts" id="counts"></div>
    <div id="table-wrap"><div class="loading">Loading…</div></div>
  </div>

</div>

<script>
/* Same convention as index.html — '' for same-origin via Ingress, explicit
   URL for local dev. */
const API_BASE = 'http://localhost:3001'; // local dev — set to '' when built for the Ingress setup
const TOKEN_KEY = 'portfolio_admin_token';

const loginView = document.getElementById('login-view');
const dashView = document.getElementById('dash-view');
let currentFilter = null;

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {}),
      Authorization: `Bearer ${getToken()}`,
    },
  });
  if (res.status === 401) {
    clearToken();
    showLogin();
    throw new Error('Session expired — please sign in again.');
  }
  return res;
}

function showLogin() {
  loginView.style.display = 'block';
  dashView.classList.remove('show');
}

function showDashboard(email) {
  loginView.style.display = 'none';
  dashView.classList.add('show');
  document.getElementById('who').textContent = `signed in as ${email}`;
  loadInquiries();
}

// ── Login ──
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await fetch(`${API_BASE}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('l-email').value,
        password: document.getElementById('l-password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed.');

    setToken(data.token);
    showDashboard(data.email);
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  clearToken();
  showLogin();
});

// ── Dashboard data ──
async function loadInquiries() {
  document.getElementById('table-wrap').innerHTML = '<div class="loading">Loading…</div>';
  try {
    const qs = currentFilter ? `?status=${currentFilter}` : '';
    const res = await apiFetch(`/api/inquiries${qs}`);
    const data = await res.json();
    renderCounts(data.counts);
    renderTable(data.inquiries);
  } catch (ex) {
    document.getElementById('table-wrap').innerHTML = `<div class="empty-state">${escapeHtml(ex.message)}</div>`;
  }
}

function renderCounts(counts) {
  const total = counts.reduce((sum, c) => sum + c.count, 0);
  const byStatus = Object.fromEntries(counts.map(c => [c.status, c.count]));
  const pills = [
    { key: null, label: 'All', count: total },
    { key: 'new', label: 'New', count: byStatus.new || 0 },
    { key: 'contacted', label: 'Contacted', count: byStatus.contacted || 0 },
    { key: 'archived', label: 'Archived', count: byStatus.archived || 0 },
  ];
  document.getElementById('counts').innerHTML = pills.map(p => `
    <button class="count-pill ${currentFilter === p.key ? 'active' : ''}" data-key="${p.key ?? ''}">
      ${p.label} · <b>${p.count}</b>
    </button>
  `).join('');
  document.querySelectorAll('.count-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.key || null;
      loadInquiries();
    });
  });
}

function renderTable(inquiries) {
  const wrap = document.getElementById('table-wrap');
  if (!inquiries.length) {
    wrap.innerHTML = '<div class="empty-state">No inquiries yet — once a recruiter submits the form on your portfolio, it shows up here.</div>';
    return;
  }
  wrap.innerHTML = `<div class="inq-list">${inquiries.map(cardHtml).join('')}</div>`;

  wrap.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', () => updateStatus(sel.dataset.id, sel.value));
  });
  wrap.querySelectorAll('.icon-btn[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => deleteInquiry(btn.dataset.delete));
  });
}

function initials(name) {
  return (name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase() || '').join('') || '?';
}

function cardHtml(inq) {
  const date = new Date(inq.created_at).toLocaleString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const interests = (inq.interests || []).map(i => `<span class="chip">${escapeHtml(i)}</span>`).join('');
  return `
    <div class="inq-card">
      <div class="inq-top">
        <div class="inq-who">
          <div class="inq-avatar">${escapeHtml(initials(inq.name))}</div>
          <div>
            <div class="inq-name">${escapeHtml(inq.name)}</div>
            <div class="inq-company">${escapeHtml(inq.company)} · <a href="mailto:${escapeHtml(inq.email)}">${escapeHtml(inq.email)}</a></div>
          </div>
        </div>
        <div class="inq-meta-right">
          <span class="inq-date">${date}</span>
          <div class="inq-actions">
            <select class="status-select" data-id="${inq.id}">
              <option value="new" ${inq.status === 'new' ? 'selected' : ''}>New</option>
              <option value="contacted" ${inq.status === 'contacted' ? 'selected' : ''}>Contacted</option>
              <option value="archived" ${inq.status === 'archived' ? 'selected' : ''}>Archived</option>
            </select>
            <button class="icon-btn" data-delete="${inq.id}">Delete</button>
          </div>
        </div>
      </div>
      <div class="inq-body">
        <div>
          <div class="inq-block-label">Role</div>
          <div class="inq-role">${escapeHtml(inq.role)}</div>
          <div class="inq-sub">${escapeHtml(inq.location || '—')}</div>
          <div class="inq-sub">${escapeHtml(inq.employment_type || '—')}</div>
        </div>
        <div>
          <div class="inq-block-label">Details</div>
          <div class="inq-desc">${escapeHtml(inq.description)}</div>
          <div class="inq-extra">
            ${inq.salary_range ? `<span>💰 ${escapeHtml(inq.salary_range)}</span>` : ''}
            ${inq.job_url ? `<a href="${escapeHtml(inq.job_url)}" target="_blank" rel="noopener">Job posting ↗</a>` : ''}
          </div>
        </div>
        <div>
          <div class="inq-block-label">Interests</div>
          <div class="chips">${interests || '<span class="inq-sub">—</span>'}</div>
        </div>
      </div>
    </div>`;
}

async function updateStatus(id, status) {
  try {
    await apiFetch(`/api/inquiries/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    loadInquiries();
  } catch (ex) {
    alert(ex.message);
  }
}

async function deleteInquiry(id) {
  if (!confirm('Delete this inquiry? This can\'t be undone.')) return;
  try {
    await apiFetch(`/api/inquiries/${id}`, { method: 'DELETE' });
    loadInquiries();
  } catch (ex) {
    alert(ex.message);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

// ── Boot ──
(async function init() {
  const token = getToken();
  if (!token) { showLogin(); return; }
  try {
    const res = await fetch(`${API_BASE}/api/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error();
    const data = await res.json();
    showDashboard(data.email);
  } catch {
    clearToken();
    showLogin();
  }
})();
</script>
</body>
</html>
